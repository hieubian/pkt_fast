<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SimuLAN Studio</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--pn:rgba(255,255,255,.76);--ink:#1d1d1f;--mut:#6e6e73;--ln:rgba(0,0,0,.12);--ac:#007aff;--ok:#28a745;--bad:#ff3b30;--warn:#ff9f0a;--fld:rgba(0,0,0,.05);--grid:rgba(0,0,0,.14)}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--card:#3a3a3c;--pn:rgba(44,44,46,.76);--ink:#f5f5f7;--mut:#a1a1a6;--ln:rgba(255,255,255,.16);--ac:#0a84ff;--ok:#30d158;--fld:rgba(255,255,255,.09);--grid:rgba(255,255,255,.16)}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.glass{background:var(--pn);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border:.5px solid var(--ln);box-shadow:0 8px 30px rgba(0,0,0,.12);border-radius:16px}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:24px 24px;cursor:default}
.bar{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;padding:5px;z-index:5;max-width:calc(100% - 24px);overflow-x:auto}
.b{border:0;background:transparent;border-radius:10px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.b:hover{background:var(--fld)}.b.on{background:var(--ac);color:#fff}.b.p{background:var(--ac);color:#fff;font-weight:600}.b:disabled{opacity:.35;cursor:default}
.sep{width:1px;height:20px;background:var(--ln);flex:none}
#ti{border:0;background:transparent;font-weight:600;width:130px;padding:7px 8px;border-radius:10px;outline:0}#ti:focus{background:var(--fld)}
#dock{position:fixed;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;padding:6px;z-index:4}
.dk{width:64px;padding:8px 4px;border-radius:12px;text-align:center;cursor:grab;font-size:11px;color:var(--mut);border:0;background:none}.dk:hover{background:var(--fld);color:var(--ink)}
svg.i{display:block;margin:0 auto 3px;width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#insp{position:fixed;right:12px;top:68px;bottom:12px;width:316px;overflow:auto;padding:16px;z-index:4}
h3{margin:0 0 2px;font-size:17px;letter-spacing:-.02em}h4{margin:18px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}
.mut{color:var(--mut)}.sm{font-size:11px}
.f{display:flex;flex-direction:column;gap:4px;margin:8px 0}.f>span{font-size:11px;color:var(--mut)}
.i{width:100%;padding:7px 10px;border-radius:10px;border:.5px solid var(--ln);background:var(--fld);outline:0;min-width:0}
.i:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 30%,transparent)}.i.bad{border-color:var(--bad)}
.r2{display:grid;grid-template-columns:1fr 64px;gap:6px}.r3{display:grid;grid-template-columns:70px 1fr 1fr;gap:6px;align-items:center}
.cd{background:var(--fld);border-radius:12px;padding:10px;margin:8px 0}
.cd>.t{display:flex;justify-content:space-between;margin-bottom:6px}
.bt{width:100%;border:0;border-radius:10px;padding:8px;margin-top:8px;background:var(--fld);cursor:pointer}.bt:hover{filter:brightness(.95)}.bt.p{background:var(--ac);color:#fff}.bt.d{color:var(--bad)}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:15px}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--fld);border-radius:99px;padding:2px 9px;margin:0 4px 4px 0}
.nd rect{fill:var(--card);stroke:var(--ln);stroke-width:1;filter:drop-shadow(0 3px 8px rgba(0,0,0,.12))}.nd{cursor:grab}
.nd.sel rect{stroke:var(--ac);stroke-width:2.5}.nd.err rect{stroke:var(--bad);stroke-width:3}.nd.src rect{stroke:var(--ok);stroke-width:3}
.nd text{fill:var(--ink);font-size:12px;text-anchor:middle;pointer-events:none}.nd .s{fill:var(--mut);font-size:10px}
.nd .ic{stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hd{fill:var(--ac);opacity:0;cursor:crosshair}.nd:hover .hd,.nd.sel .hd,.lm .hd{opacity:1}
.lk{stroke:var(--mut);stroke-width:2.5;fill:none}.lk.tr{stroke:var(--ac)}.lk.sel{stroke:var(--warn);stroke-width:4}.hit{stroke:transparent;stroke-width:16;cursor:pointer}
.pl{font-size:10px;fill:var(--mut);paint-order:stroke;stroke:var(--bg);stroke-width:4px;text-anchor:middle;pointer-events:none}
#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:9px 16px;z-index:5;display:none}
#res{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:min(460px,calc(100% - 24px));padding:14px 16px;z-index:6;display:none}
#res pre{margin:8px 0 0;font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);white-space:pre-wrap}
#toast{position:fixed;top:70px;left:50%;transform:translate(-50%,-8px);padding:9px 16px;z-index:9;opacity:0;pointer-events:none;transition:.25s}#toast.on{opacity:1;transform:translate(-50%,0)}
#pop{position:fixed;z-index:8;padding:6px;display:none;min-width:200px}#pop button{display:block;width:100%;text-align:left}
.sc{position:fixed;inset:0;background:rgba(0,0,0,.3);display:grid;place-items:center;z-index:10}.md{width:min(440px,calc(100% - 24px));padding:20px;background:var(--card)}
ul.e{margin:8px 0;padding-left:18px;color:var(--bad)}ul.w{margin:8px 0;padding-left:18px;color:var(--warn)}
@media(max-width:820px){#insp{top:auto;height:44vh;left:12px;width:auto}#dock{top:68px;transform:none;flex-direction:row;left:12px}.dk{width:54px}}
</style></head><body>
<svg id="cv"><g id="vp"><g id="lk"></g><g id="nd"></g><g id="pk"></g></g></svg>
<div class="bar glass">
 <input id="ti" aria-label="Tên sơ đồ" spellcheck="false">
 <i class="sep"></i>
 <button class="b on" id="t-select" title="Chọn (V)">Chọn</button>
 <button class="b" id="t-link" title="Nối dây (C)">Nối dây</button>
 <button class="b" id="t-ping" title="Ping (P)">Ping</button>
 <i class="sep"></i>
 <button class="b" id="un" title="Hoàn tác (⌘Z)">↶</button><button class="b" id="re" title="Làm lại (⇧⌘Z)">↷</button>
 <i class="sep"></i>
 <button class="b" id="mm">Mẫu ▾</button><button class="b" id="sv">Lưu</button><button class="b" id="op">Mở</button>
 <button class="b p" id="ex">Xuất .pkt</button>
</div>
<nav id="dock" class="glass" aria-label="Thiết bị"></nav>
<aside id="insp" class="glass"></aside>
<div id="hint" class="glass"></div><div id="res" class="glass"></div><div id="toast" class="glass"></div>
<div id="pop" class="glass"></div><div id="ms"></div>
<input type="file" id="fi" accept=".json,application/json" hidden>
<script>
(()=>{
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TY={pc:'PC',laptop:'Laptop',switch:'Switch',router:'Router'},PFX={pc:'PC',laptop:'Laptop',switch:'SW',router:'R'};
const IC={pc:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',laptop:'<path d="M5 6a1 1 0 011-1h12a1 1 0 011 1v9H5z"/><path d="M2 18h20"/>',switch:'<rect x="2" y="8" width="20" height="8" rx="2"/><path d="M6 12h.01M10 12h.01M14 12h.01M18 12h.01"/>',router:'<circle cx="12" cy="12" r="8"/><path d="M12 7v10M7 12h10M9.5 9.5L12 7l2.5 2.5M9.5 14.5L12 17l2.5-2.5"/>'};
const NAME=/^[A-Za-z][A-Za-z0-9_-]{0,31}$/;
let S,sel=null,selC=null,tool='select',ps=null,V={x:0,y:0,k:1},hist=[],hi=-1,seq=0,drag=null,res=null,flash=null;
const cv=$('#cv'),D=()=>S.devices,C=()=>S.connections,get=id=>D().find(d=>d.id==id),isH=d=>d.type=='pc'||d.type=='laptop';
/* ---------- IP ---------- */
const ip2n=s=>{const p=String(s||'').trim().split('.');if(p.length!=4||p.some(x=>!/^\d{1,3}$/.test(x)||+x>255))return null;return((+p[0]<<24)|(+p[1]<<16)|(+p[2]<<8)|+p[3])>>>0};
const msk=c=>c<=0?0:(0xFFFFFFFF<<(32-c))>>>0,nw=(ip,c)=>(ip2n(ip)&msk(+c))>>>0;
const inNet=(ip,cd)=>{if(!cd||cd=='any'||cd=='*')return true;const[a,b]=String(cd).split('/'),c=b==null?32:+b;return ip2n(ip)!=null&&ip2n(a)!=null&&nw(ip,c)==nw(a,c)};
const okCidr=s=>s=='any'||(/^\d+\.\d+\.\d+\.\d+\/\d{1,2}$/.test(s)&&ip2n(s.split('/')[0])!=null&&+s.split('/')[1]<=32);
/* ---------- Ports & links ---------- */
const ports=d=>d.type=='router'?(d.model=='2811'?['fa0/0','fa0/1']:['g0/0','g0/1','g0/2']):d.type=='switch'?Array.from({length:24},(_,i)=>'fa0/'+(i+1)):['fa0'];
const used=(d,p)=>C().find(c=>(c.from==d.id&&c.fromPort==p)||(c.to==d.id&&c.toPort==p));
const freePort=d=>ports(d).find(p=>!used(d,p));
const peer=(d,p)=>{const c=used(d,p);if(!c)return null;return c.from==d.id&&c.fromPort==p?{c,d:get(c.to),p:c.toPort}:{c,d:get(c.from),p:c.fromPort}};
const rifs=r=>(r.interfaces||[]).filter(i=>ip2n(i.ip)!=null&&used(r,i.name.split('.')[0]));
const myPort=(c,d)=>c.from==d.id?c.fromPort:c.toPort;
/* ---------- Mô phỏng L2/L3 ---------- */
function owns(n,port,v,want){
 if(want==null)return null;
 if(isH(n))return v==null&&port=='fa0'&&ip2n(n.config.ip)==want?{name:'fa0'}:null;
 if(n.type=='router')return rifs(n).find(i=>{const[b,s]=i.name.split('.');return b==port&&(s?+s==v:v==null)&&ip2n(i.ip)==want})||null;
 return null}
/* Khung rời d qua cổng p (v=null: không tag). Switch học VLAN theo access/trunk, chặn khung tag vào cổng access. */
function walk(d,p,v,ip){
 const seen=new Set(),want=ip2n(ip);let found=null;
 (function go(d,p,v,tr){
  if(found)return;const pr=peer(d,p);if(!pr)return;
  const n=pr.d,k=n.id+'|'+pr.p;if(seen.has(k))return;seen.add(k);
  if(n.type=='switch'){
   const pc=n.ports[pr.c.id]||{mode:'access',vlan:1};let vl;
   if(pc.mode=='access'){if(v!=null)return;vl=+pc.vlan}else vl=v==null?1:v;
   if(!n.vlans.includes(vl))return;
   for(const q of ports(n)){if(q==pr.p)continue;const l=used(n,q);if(!l)continue;
    const qc=n.ports[l.id]||{mode:'access',vlan:1};
    if(qc.mode=='access'&&+qc.vlan!=vl)continue;
    go(n,q,qc.mode=='trunk'&&vl!=1?vl:null,[...tr,n.id])}
  }else{const m=owns(n,pr.p,v,want);if(m)found={dev:n,port:pr.p,iface:m,trail:[...tr,n.id]}}
 })(d,p,v,[d.id]);return found}
const blocked=(s,d)=>S.firewallRules.find(r=>r.action!='allow'&&inNet(s,r.source)&&inNet(d,r.dest));
const tgt=(b,A)=>{if(isH(b))return ip2n(b.config.ip)!=null?b.config.ip:'';const i=rifs(b),m=i.find(x=>nw(x.ip,x.cidr)==nw(A.ip,A.cidr))||i[0];return m?m.ip:''};
function pingSim(a,b){
 const L=[],bad=m=>({ok:false,msg:m,lines:L,hops:[]}),A=a.config;
 if(ip2n(A.ip)==null)return bad(`${a.name} chưa có địa chỉ IP hợp lệ.`);
 const tip=tgt(b,A);if(!tip)return bad(`${b.name} chưa có địa chỉ IP.`);
 const same=nw(tip,A.cidr)==nw(A.ip,A.cidr);let nh=tip;
 if(!same){
  if(ip2n(A.gateway)==null)return bad(`${a.name} chưa đặt Default Gateway nên không gửi được tới mạng khác.`);
  if(nw(A.gateway,A.cidr)!=nw(A.ip,A.cidr))return bad(`Gateway ${A.gateway} không cùng mạng với ${a.name} (${A.ip}/${A.cidr}).`);nh=A.gateway}
 L.push(`Ping ${tip} từ ${a.name} (${A.ip})`,`ARP: ${a.name} hỏi “ai có ${nh}?”`);
 const f1=walk(a,'fa0',null,nh);
 if(!f1)return bad(`Destination host unreachable — không ai trả lời ARP cho ${nh}. Kiểm tra cáp, VLAN, trunk và IP.`);
 L.push(`ARP reply: ${f1.dev.name} (${nh})`);
 let hops=f1.trail,ttl=128;const bl=!same&&blocked(A.ip,tip);
 if(same){if(f1.dev.id!=b.id)return bad(`Trùng địa chỉ IP ${tip}: ${f1.dev.name} đã trả lời thay ${b.name}.`)}
 else{
  const r=f1.dev;if(r.type!='router')return bad(`${r.name} giữ địa chỉ ${nh} nhưng không phải router nên không chuyển tiếp gói tin.`);
  if(bl)return bad(`Destination host unreachable — ${r.name} chặn gói tin theo ACL (${bl.source} → ${bl.dest}).`);
  if(r.id==b.id)ttl=255;
  else{
   const eg=rifs(r).find(i=>nw(tip,i.cidr)==nw(i.ip,i.cidr));
   if(!eg)return bad(`Destination net unreachable — ${r.name} không có interface nào thuộc mạng của ${tip}.`);
   L.push(`${r.name} định tuyến ra ${eg.name}`,`ARP: ${r.name} hỏi “ai có ${tip}?” trên ${eg.name}`);
   const[eb,es]=eg.name.split('.'),f2=walk(r,eb,es?+es:null,tip);
   if(!f2||f2.dev.id!=b.id)return bad(`Destination host unreachable — ${r.name} không thấy ${tip} trên ${eg.name}. Kiểm tra VLAN/trunk phía ${b.name}.`);
   hops=[...hops,...f2.trail.slice(1)];ttl=127}}
 const rb=!same&&blocked(tip,A.ip);if(rb)return bad(`Gói trả lời bị ACL chặn (${rb.source} → ${rb.dest}).`);
 L.push(`ICMP echo request → ${b.name}`,`ICMP echo reply ← ${b.name} · TTL=${ttl}`);
 return{ok:true,msg:`Thông — ${a.name} → ${b.name} (${tip})`,lines:L,hops}}
/* ---------- Trạng thái ---------- */
const blank=n=>({name:n||'topology',devices:[],connections:[],firewallRules:[]});
function norm(d){d.config=d.config||{};d.x=+d.x||0;d.y=+d.y||0;
 if(isH(d)){d.config.ip??='';d.config.cidr=+d.config.cidr||24;d.config.gateway??=''}
 if(d.type=='router'){d.model=d.model=='2811'?'2811':'2911';d.interfaces=Array.isArray(d.interfaces)?d.interfaces.filter(i=>i&&i.name).map(i=>({...i,name:String(i.name).toLowerCase(),ip:i.ip||'',cidr:+i.cidr||24})):[]}
 if(d.type=='switch'){d.vlans=(Array.isArray(d.vlans)&&d.vlans.length?d.vlans:[1]).map(Number);if(!d.vlans.includes(1))d.vlans.unshift(1);d.ports=d.ports&&typeof d.ports=='object'?d.ports:{}}return d}
function load(o){
 const ok=new Set(Object.keys(TY));let drop=0;S=blank(String(o.name||'topology'));
 S.devices=(o.devices||[]).filter(d=>ok.has(d.type)||(drop++,0)).map(d=>norm({...d}));
 const ids=new Set(D().map(d=>d.id));
 S.connections=(o.connections||[]).filter(c=>ids.has(c.from)&&ids.has(c.to)&&c.fromPort&&c.toPort).map(c=>({...c,fromPort:String(c.fromPort).toLowerCase(),toPort:String(c.toPort).toLowerCase()}));
 S.firewallRules=(o.firewallRules||[]).filter(r=>r.source&&r.dest).map(r=>({source:r.source,dest:r.dest,action:'deny'}));
 seq=100;sel=selC=null;V={x:0,y:0,k:1};hist=[];hi=-1;commit();if(drop)toast(`Đã bỏ ${drop} thiết bị không hỗ trợ (Server, AP, Firewall…).`)}
function commit(keep){const j=JSON.stringify(S);if(hist[hi]!==j){hist=hist.slice(0,hi+1);hist.push(j);if(hist.length>80)hist.shift();hi=hist.length-1;try{localStorage.setItem('simulan.v2',j)}catch(e){}}draw(keep)}
function undo(n){const t=hi+n;if(t<0||t>=hist.length)return;hi=t;S=JSON.parse(hist[hi]);sel=selC=null;draw()}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3000)}
/* ---------- Thao tác ---------- */
function addDev(type,x,y,name,q){
 let n=1;while(D().some(d=>d.name.toLowerCase()==(name||PFX[type]+n).toLowerCase())&&!name)n++;
 const d=norm({id:'d'+(++seq),type,name:name||PFX[type]+n,x:Math.round(x),y:Math.round(y)});
 if(type=='router')d.model='2911';D().push(d);if(!q){sel=d.id;selC=null;commit()}return d}
function connect(a,b,q){
 if(a.id==b.id)return;
 if(C().some(c=>(c.from==a.id&&c.to==b.id)||(c.from==b.id&&c.to==a.id)))return toast('Hai thiết bị đã được nối với nhau.');
 const pa=freePort(a),pb=freePort(b);if(!pa||!pb)return toast(`${pa?b.name:a.name} đã hết cổng trống.`);
 const c={id:'c'+(++seq),from:a.id,to:b.id,fromPort:pa,toPort:pb};C().push(c);
 [[a,b],[b,a]].forEach(([x,y])=>{if(x.type=='switch')x.ports[c.id]={mode:y.type=='router'||y.type=='switch'?'trunk':'access',vlan:1}});
 if(!q){selC=c.id;sel=null;commit()}return c}
function rmConn(id){C().forEach(c=>{if(c.id==id)[c.from,c.to].forEach(x=>{const d=get(x);if(d&&d.ports)delete d.ports[id]})});S.connections=C().filter(c=>c.id!=id)}
function del(){if(sel){const d=get(sel);C().filter(c=>c.from==sel||c.to==sel).forEach(c=>rmConn(c.id));S.devices=D().filter(x=>x.id!=sel);sel=null;toast(`Đã xóa ${d.name}.`)}else if(selC){rmConn(selC);selC=null}else return;commit()}
function freeSpot(x,y){for(let i=0;i<40;i++){if(!D().some(d=>Math.abs(d.x-x)<90&&Math.abs(d.y-y)<90))break;x+=40;if(i%6==5){x-=240;y+=90}}return[x,y]}
const W=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-V.x)/V.k,y:(e.clientY-r.top-V.y)/V.k}};
function dropAt(t,x,y){const[a,b]=freeSpot(x,y);addDev(t,a,b)}
/* ---------- Vẽ ---------- */
const pt=(a,b,d)=>{const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;return[a.x+dx/l*d,a.y+dy/l*d+3]};
function paint(){
 let L='',N='';
 C().forEach(c=>{const a=get(c.from),b=get(c.to);if(!a||!b)return;
  const tr=[a,b].some(x=>x.type=='switch'&&(x.ports[c.id]||{}).mode=='trunk'),s=selC==c.id,sh=s||sel==a.id||sel==b.id;
  L+=`<g data-c="${c.id}"><line class="hit" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/><line class="lk${tr?' tr':''}${s?' sel':''}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
  if(sh){const p=pt(a,b,50),q=pt(b,a,50);L+=`<text class="pl" x="${p[0]}" y="${p[1]}">${c.fromPort}</text><text class="pl" x="${q[0]}" y="${q[1]}">${c.toPort}</text>`}L+='</g>'});
 D().forEach(d=>{
  const ip=isH(d)?d.config.ip:d.type=='router'?(rifs(d)[0]||{}).ip:'';
  N+=`<g class="nd${sel==d.id?' sel':''}${flash==d.id?' err':''}${ps&&ps.src==d.id?' src':''}" data-d="${d.id}" transform="translate(${d.x},${d.y})"><rect x="-32" y="-32" width="64" height="64" rx="16"/><svg class="ic" x="-17" y="-17" width="34" height="34" viewBox="0 0 24 24">${IC[d.type]}</svg><text y="50">${E(d.name)}</text>${ip?`<text class="s" y="63">${E(ip)}</text>`:''}<circle class="hd" data-h="${d.id}" cx="32" cy="0" r="7"/></g>`});
 $('#lk').innerHTML=L;$('#nd').innerHTML=N;
 $('#vp').setAttribute('transform',`translate(${V.x},${V.y}) scale(${V.k})`);

 <div style="display:flex;gap:8px;margin-top:10px"><button class="bt" id="xc">Hủy</button><button class="bt p" id="xg" ${e.length?'disabled':''}>Tạo file .pkt</button></div></div></div>`;
 $('#xc').onclick=()=>$('#ms').innerHTML='';$('#sc').onclick=ev=>{if(ev.target.id=='sc')$('#ms').innerHTML=''};
 $('#xg').onclick=async()=>{const n=($('#fn').value.trim().replace(/[^A-Za-z0-9_-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,48))||'topology',b=$('#xg');b.disabled=true;b.textContent='Đang tạo…';
  try{const r=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,devices:D(),connections:C(),firewallRules:S.firewallRules})});
   if(!r.ok){let m='Không tạo được file .pkt.';try{m=(await r.json()).error||m}catch(x){}throw new Error(m)}
   const bl=await r.blob();if(!bl.size)throw new Error('Máy chủ trả về file rỗng.');dl(bl,n+'.pkt');$('#ms').innerHTML='';toast(`Đã tải ${n}.pkt`)}
  catch(x){$('#em').textContent=x.message;b.disabled=false;b.textContent='Tạo file .pkt'}}};

let saved=null;try{saved=JSON.parse(localStorage.getItem('simulan.v2'))}catch(e){}
if(saved&&Array.isArray(saved.devices)&&saved.devices.length)load(saved);else preset('basic');
})();
